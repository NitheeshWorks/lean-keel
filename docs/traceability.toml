upstream = "STYLE.md section 2: Codec"
title = "Length-prefixed fields"
status = "implemented"
realises = ["Keel.Codec.lengthPrefixed"]
theorem = ["Keel.Codec.lengthPrefixed_lawful"]
test = ["tests/Props.lean::Codec.lengthPrefixed + manyTill: frames round-trip on any continuation"]

[[requirement]]
id = "codec.many"
upstream = "STYLE.md section 2: Codec"
title = "Repetition to the end and to a terminator"
status = "implemented"
realises = ["Keel.Codec.many", "Keel.Codec.manyTill"]
theorem = ["Keel.Codec.many_lawful", "Keel.Codec.manyTill_lawful"]
test = ["tests/Props.lean::Codec.lengthPrefixed + manyTill: frames round-trip on any continuation"]

[[requirement]]
id = "codec.base"
