upstream = "tests/test_routing.py::test_url_path_for"
title = "match (urlFor v) = some v on aligned templates"
status = "implemented"
realises = ["Keel.PathTemplate.match", "Keel.PathTemplate.urlFor"]
theorem = ["Keel.PathTemplate.match_urlFor"]
