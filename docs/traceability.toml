# Traceability register: upstream behaviour -> Lean symbol -> theorem -> test.
#
# `scripts/traceability-check.py` validates it on every CI run: every
# `realises`/`theorem` symbol must resolve, every `test` path must exist.
#
# status: implemented | partial | tested | excluded | deviation
#   implemented  realised and proved
#   partial      realised, proof incomplete or covering a subset
#   tested       realised, deliberately tested rather than proved (say why)
#   excluded     out of scope, rejected by name
#   deviation    behaviour differs from upstream on purpose (say how)

[meta]
upstream_name = "none (original theory library)"

[[requirement]]
id = "parse.total"
upstream = "STYLE.md section 2: total parsing"
title = "Every parser is total: many and fix recurse well-founded on the tokens left, no fuel, no partial"
status = "implemented"
realises = ["Keel.Parser.many", "Keel.Parser.fix", "Keel.Parser.below"]
theorem = ["Keel.Parser.parse_many", "Keel.Parser.parse_fix", "Keel.Parser.parse_below"]
test = ["tests/Props.lean::Parse.fix reads nested brackets"]

[[requirement]]
id = "parse.ext"
upstream = "STYLE.md section 2: total parsing"
title = "A parser is determined by its meaning on lists"
status = "implemented"
realises = ["Keel.Parser.parse"]
theorem = ["Keel.Parser.ext"]

[[requirement]]
id = "parse.buffers"
upstream = "STYLE.md section 2: total parsing"
title = "Runs on any buffer (List, Array, ByteArray, Slice) as its list meaning says"
status = "implemented"
realises = ["Keel.Input", "Keel.Parser.runFrom", "Keel.Parser.parseBytes", "Keel.Parser.parseString"]
theorem = ["Keel.Parser.run_eq_of_parse", "Keel.Parser.parse_of_run"]
test = ["tests/Props.lean::Parse.takeWhile is List.takeWhile, on a ByteArray"]

[[requirement]]
id = "parse.monad"
upstream = "STYLE.md section 2: total parsing"
title = "Lawful monad; sequencing continues on what is left"
status = "implemented"
realises = ["Keel.Parser.bind"]
theorem = ["Keel.Parser.parse_bind", "Keel.Parser.parse_pure", "Keel.Parser.parse_map"]

[[requirement]]
id = "parse.choice"
upstream = "STYLE.md section 2: total parsing"
title = "Committed choice (Parsec): the alternative runs only after a failure that consumed nothing"
status = "implemented"
realises = ["Keel.Parser.orElse", "Keel.Parser.attempt"]
theorem = ["Keel.Parser.parse_orElse", "Keel.Parser.parse_attempt"]

[[requirement]]
id = "parse.lit"
upstream = "STYLE.md section 2: total parsing"
title = "Literals and lookahead"
status = "implemented"
realises = ["Keel.Parser.lit", "Keel.Parser.startsWith"]
theorem = ["Keel.Parser.parse_lit", "Keel.Parser.parse_lit_ok", "Keel.Parser.parse_startsWith"]
test = ["tests/Props.lean::Parse.lit and startsWith agree with the prefix relation"]

[[requirement]]
id = "parse.takeWhile"
upstream = "STYLE.md section 2: total parsing"
title = "takeWhile is List.takeWhile"
status = "implemented"
realises = ["Keel.Parser.takeWhile"]
theorem = ["Keel.Parser.parse_takeWhile"]
test = ["tests/Props.lean::Parse.takeWhile is List.takeWhile, on a ByteArray"]

[[requirement]]
id = "parse.isolate"
upstream = "STYLE.md section 2: total parsing"
title = "isolate n p runs p on exactly the next n tokens, without copying"
status = "implemented"
realises = ["Keel.Parser.isolate"]
theorem = ["Keel.Parser.parse_isolate", "Keel.Parser.parse_isolate_append"]
test = ["tests/Props.lean::Parse.isolate confines a parser to n tokens"]

[[requirement]]
id = "codec.law"
upstream = "STYLE.md section 2: Codec"
title = "decode (encode a ++ rest) = some (a, rest) on any tolerated continuation"
status = "implemented"
