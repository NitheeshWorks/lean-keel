name = "Keel"
version = "0.1.0"
defaultTargets = ["Keel", "props", "conformance", "Examples", "examples", "bench", "axioms"]

# The verified library. Everything under Keel/ except Transport.lean is a
# total function and the proof surface; see CONTRIBUTING.md.
[[lean_lib]]
name = "Keel"

# Property tests for what is tested rather than proved. No dependencies, runs
# in well under a second: `lake exe props [seed]`.
[[lean_exe]]
name = "props"
root = "tests.Props"

# Conformance cases re-expressed from the upstream test suite:
# `lake exe conformance`. Each case names the upstream test it mirrors.
[[lean_exe]]
name = "conformance"
root = "tests.Conformance"

# Worked examples, one per theory (examples/MANIFEST.toml): built by default,
# run with `lake exe examples`.
[[lean_lib]]
name = "Examples"
srcDir = "examples"
roots = ["Examples"]

[[lean_exe]]
name = "examples"
root = "Examples.Main"
srcDir = "examples"

# Routing time on long request paths, with bounds: `lake exe bench`.
[[lean_exe]]
name = "bench"
root = "tests.Bench"

# The verification gate, compiled: scripts/Axioms.lean is a byte-for-byte
# copy of stack-tools/Axioms.lean, pinned by scripts/Axioms.sha256.
# `lake exe axioms Keel`.
[[lean_exe]]
name = "axioms"
root = "scripts.Axioms"
supportInterpreter = true
